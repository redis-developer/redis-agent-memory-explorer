services:
  demo-app:
    build:
      context: .
      dockerfile: Dockerfile
      target: app
    ports:
      - "3001:3001"
    env_file: .env
    environment:
      MEETING_MEMORY_DATA_DIR: /app/data
      MEETING_MEMORY_ALLOWED_ORIGINS: "http://localhost:3000,http://localhost:3001"
      LANGGRAPH_DEPLOYMENT_URL: http://demo-langgraph:2024
    volumes:
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  demo-langgraph:
    build:
      context: .
      dockerfile: Dockerfile
      target: app
    command: npx @langchain/langgraph-cli@1.1.17 dev --port 2024 --host 0.0.0.0
    working_dir: /app/backend
    ports:
      - "2024:2024"
    env_file: .env
    volumes:
      - ./logs:/app/logs
